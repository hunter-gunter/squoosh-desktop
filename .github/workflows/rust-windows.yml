name: Rust Windows

on:
  push:
    # Tags are built by release.yml, which calls this workflow.
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\target\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Installer Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal -c clippy
          rustup default 1.95.0
      - name: Install NASM and Inno Setup
        run: choco install nasm innosetup --no-progress -y
      - name: Cache the vcpkg libraries
        uses: actions/cache@v4
        with:
          path: target/vcpkg-cache
          key: vcpkg-x64-windows-static-${{ hashFiles('vcpkg.json', 'scripts/windows.ps1') }}
      - name: Prepare the vcpkg cache
        run: New-Item -ItemType Directory -Force target/vcpkg-cache | Out-Null
      - name: Test and build the packages
        run: ./scripts/windows.ps1 -Test
      - name: Clippy
        run: |
          $env:SQUOOSH_NATIVE_PREFIX = "$PWD\vcpkg_installed\x64-windows-static"
          $env:LCMS2_LIB_DIR = "$env:SQUOOSH_NATIVE_PREFIX\lib"
          $env:LCMS2_INCLUDE_DIR = "$env:SQUOOSH_NATIVE_PREFIX\include"
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the standalone executable
        run: |
          $exe = 'target\release\squoosh-desktop.exe'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $dlls = & $dumpbin.FullName /dependents $exe | Where-Object { $_ -match '^\s+\S+\.dll$' } | ForEach-Object { $_.Trim().ToLower() }
          $dlls
          # Only DLLs shipped with Windows 10: no VC++ runtime, no codec DLL.
          $foreign = $dlls | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|libwebp|avif|aom|lcms|yuv|jpeg)' }
          if ($foreign) { throw "Unexpected dependencies: $foreign" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            target/dist/*.zip
            target/dist/*-setup.exe
