[package]
name = "squoosh-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
squoosh-core = { path = "../core" }
squoosh-codecs = { path = "../codecs" }
anyhow.workspace = true
serde_json.workspace = true
image.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
rfd = "0.17"
crossbeam-channel = "0.5"
resvg = "0.48"

# Direct3D 12 on Windows (WARP when no GPU driver is present, e.g. in a VM
# or over Remote Desktop), with Vulkan and OpenGL as fallbacks.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu"] }

[build-dependencies]
winresource = "0.1"

[features]
screenshot = ["eframe/__screenshot"]
