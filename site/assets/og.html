<!doctype html>
<!-- Source of og.png, the 1200x630 preview of the website, and of the 1280x640 social
     preview of the GitHub repository (Settings > General > Social preview). From site/assets:
     chromium --headless=new --hide-scrollbars --allow-file-access-from-files --window-size=1200,630 --screenshot=og.png og.html
     chromium --headless=new --hide-scrollbars --allow-file-access-from-files --window-size=1280,640 --screenshot=../../docs/social-preview.png "og.html#github" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Squoosh Desktop</title>
<link rel="stylesheet" href="fonts.css">
<style>
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #fff5e1 linear-gradient(rgb(13 13 13 / .07) 1px, transparent 1px) 0 0 / 40px 40px;
    font-family: 'Onest', sans-serif; color: #0d0d0d; }
  body::before { content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgb(13 13 13 / .07) 1px, transparent 1px) 0 0 / 40px 40px; }
  .text { position: absolute; left: 64px; top: 36px; width: 560px; }
  .logo { width: 84px; height: 84px; border: 4px solid #0d0d0d; box-shadow: 6px 6px 0 #0d0d0d; background: #3f3f3e; }
  h1 { font: 900 68px/1 'Unbounded', sans-serif; margin: 24px 0 22px; letter-spacing: -.01em; }
  .sub { display: inline-block; background: #ff3d8b; border: 4px solid #0d0d0d; box-shadow: 6px 6px 0 #0d0d0d;
    padding: 8px 16px; font: 800 26px 'Unbounded', sans-serif; white-space: nowrap; transform: rotate(-2deg); }
  .os { margin: 22px 0 0; font-weight: 700; font-size: 26px; }
  .shot { position: absolute; left: 640px; top: 70px; width: 640px; border: 4px solid #0d0d0d;
    box-shadow: 14px 14px 0 #0d0d0d; background: #0d0d0d; }
  .shot::before { content: ''; display: block; height: 30px; border-bottom: 4px solid #0d0d0d; background: #fffdf8; }
  .shot img { display: block; width: 100%; }
  .band { position: absolute; left: -40px; right: -40px; bottom: 26px; background: #0d0d0d; color: #ffd23f;
    font: 900 26px 'Unbounded', sans-serif; padding: 12px 60px; transform: rotate(-2deg); word-spacing: 14px; white-space: nowrap; }
  .band b { color: #ff3d8b; }
  .rust { display: inline-flex; align-items: center; gap: 12px; margin: 22px 0 0; padding: 6px 16px 6px 8px;
    background: #0d0d0d; color: #fffdf8; border: 4px solid #0d0d0d; box-shadow: 6px 6px 0 #f74c00;
    font: 800 24px 'Unbounded', sans-serif; transform: rotate(-1deg); }
  .rust img { width: 40px; height: 40px; padding: 4px; background: #f74c00; border-radius: 50%; }
  .github { width: 1280px; height: 640px; }
  .github .text { left: 76px; top: 40px; }
  .github .shot { left: 700px; width: 660px; }
</style>
</head>
<body>
  <script>if (location.hash === "#github") document.body.className = "github";</script>
  <div class="text">
    <img class="logo" src="icon-192.png" alt="">
    <h1>Squoosh Desktop</h1>
    <span class="sub">Compress images offline.</span>
    <p class="os">Free · Open source · Windows &amp; Linux</p>
    <p class="rust"><img src="../icons/rust.svg" alt="">Written in Rust</p>
  </div>
  <div class="shot"><img src="../../docs/screenshots/editor.webp" alt=""></div>
  <div class="band">Rust <b>✦</b> MozJPEG <b>✦</b> OxiPNG <b>✦</b> WebP <b>✦</b> AVIF <b>✦</b> Batch <b>✦</b> 17 languages <b>✦</b> MozJPEG</div>
</body>
</html>
